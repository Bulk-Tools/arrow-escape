name: Android CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.9' }
      - name: Generate sound effects
        run: python3 tools/gen_sounds.py
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: ArrowEscape-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      - name: Stage APK with stable filename
        run: cp app/build/outputs/apk/debug/app-debug.apk ArrowEscape.apk
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: ArrowEscape.apk
